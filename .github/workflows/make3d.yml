name: Make 3D models
# when the character pictures change: picture → textured 3D (Hunyuan3D-2 demo), results on the model-output branch
on:
  push:
    branches: [main]
    paths: ['tools/3d/source/poppy_*', 'tools/3d/make3d.py', '.github/workflows/make3d.yml']
permissions: { contents: write }
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install gradio_client pillow
      - name: Picture to 3D
        env: { HF_TOKEN: '${{ secrets.HF_TOKEN }}' }
        run: python tools/3d/make3d.py tools/3d/source out rabbit || true
      - name: Publish
        if: always()
        run: |
          mkdir -p out; cd out && git init -q && git checkout -q -b model-output && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "models ${{ github.run_number }}" --allow-empty
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" model-output
